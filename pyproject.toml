[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lleaves"
authors = [{name = "Simon Boehm", email = "simon@siboehm.com"}]
description = "LLVM-based compiler for LightGBM models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "llvmlite>=0.36",
    "numpy",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/siboehm/lleaves"
Documentation = "https://lleaves.readthedocs.io/en/latest/"
Repository = "https://github.com/siboehm/lleaves"
Issues = "https://github.com/siboehm/lleaves/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "hypothesis",
    "lightgbm<4",  # Pin needed until https://github.com/onnx/onnxmltools/issues/645 is fixed
    "pyarrow",
    "pandas",
]
dev = [
    "pre-commit",
    "ruff",
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "numpydoc",
    "sphinxcontrib-apidoc",
]
benchmark = [
    "treelite",
    "onnxruntime",
    "onnxmltools",
]
all = [
    "lleaves[test,dev,docs,benchmark]",
]

[tool.setuptools]
packages = ["lleaves"]

[tool.setuptools.package-dir]
lleaves = "lleaves"

[tool.setuptools_scm]
write_to = "lleaves/_version.py"

[tool.ruff]
# 1. Enable flake8-bugbear (`B`) rules, in addition to the defaults.
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
# 2. Avoid enforcing line-length violations (`E501`)
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
