name: CI
on:
  push:
    branches: [ master ]
    tags:
      - '*'
  pull_request:
    branches: ['*']
  workflow_dispatch:

jobs:
  linux-unittest:
    name: Linux unittest - ${{ matrix.PYTHON_VERSION }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Setup uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-${{ matrix.PYTHON_VERSION }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-
            uv-${{ runner.os }}-
      - name: Setup hypothesis DB cache
        uses: actions/cache@v4
        with:
          path: ./.hypothesis
          key: hypothesisDB ${{ matrix.PYTHON_VERSION }}
      - name: Run the unittests
        run: ./.github/ci.sh ${{ matrix.PYTHON_VERSION }}
      - name: Publish a Python distribution to PyPI
        if: startsWith(github.ref, 'refs/tags') && matrix.PYTHON_VERSION == '3.13'
        uses: pypa/gh-action-pypi-publish@v1.9.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  pre-commit-checks:
    name: "Pre-commit checks - Python 3.13"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1
