name: CI
on:
  push:
    branches: [ master ]
    tags:
      - '*'
  pull_request:
    branches: ['*']
  workflow_dispatch:

jobs:
  linux-unittest:
    name: Linux unittest - ${{ matrix.PYTHON_VERSION }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true  # Stop all jobs on first failure for faster feedback
      matrix:
        PYTHON_VERSION: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.PYTHON_VERSION }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Setup hypothesis DB cache
        uses: actions/cache@v4
        with:
          path: ./.hypothesis
          key: hypothesisDB ${{ matrix.PYTHON_VERSION }}
      - name: Install dependencies with uv
        run: |
          source $HOME/.cargo/env
          uv pip install --system pytest hypothesis lightgbm pandas pyarrow treelite onnxruntime onnxmltools numpy "llvmlite>=0.36,<0.45"
      - name: Run the unittests
        run: ./.github/ci.sh ${{ matrix.PYTHON_VERSION }}
      - name: Publish a Python distribution to PyPI
        if: startsWith(github.ref, 'refs/tags') && matrix.PYTHON_VERSION == '3.9'
        uses: pypa/gh-action-pypi-publish@v1.12.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  pre-commit-checks:
    name: "Pre-commit checks - Python 3.9"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1
